name: NGINEER Neo4j keep-alive

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping NGINEER Neo4j keep-alive endpoint
        run: |
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.NGINEER_KEEPALIVE_TOKEN }}" \
            "${{ secrets.NGINEER_KEEPALIVE_URL }}"
